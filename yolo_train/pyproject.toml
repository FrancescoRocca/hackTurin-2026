[project]
name = "uno-q-vehicle-detection"
version = "0.1.0"
description = "Vehicle and pedestrian detection models (YOLO11n, YOLOX-Nano) for the Arduino UNO Q"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3,<9",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
src = ["scripts", "scripts/yolox"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
