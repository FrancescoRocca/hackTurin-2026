<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>larp - Smart Camera, exploded view</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Righteous";
        src: url("assets/fonts/Righteous-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/JetBrainsMono-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }

      :root {
        --bg: #0a0e14;
        --ink: #eef2f8;
        --mute: #8d9aae;
        --amber: #ffb703; /* printed accessories */
        --cyan: #2ec4b6; /* electronics */
        --steel: #aeb6c4; /* hardware */
        --blue: #3d8bff; /* "larp" wordmark */
        --display: "Righteous", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
      }

      /* ---- OpenSCAD render (pre-rendered frames, see smart-camera/video) ---- */
      #vwrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #render {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }

      /* ---- atmosphere (decorative, above the render) ---- */
      #grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(130, 170, 255, 0.55) 1.4px, transparent 1.6px);
        background-size: 48px 48px;
        mix-blend-mode: screen;
        opacity: 0.1;
        -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 78%);
        mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 78%);
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(4, 6, 10, 0.75) 100%);
      }

      /* ---- UI layer: full-duration clip holding every overlay ---- */
      #ui {
        position: absolute;
        inset: 0;
      }
      #lines {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.9));
      }
      #lines polyline {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      #lines circle {
        stroke-width: 2.5;
      }
      .g-print { --c: var(--amber); }
      .g-elec { --c: var(--cyan); }
      .g-hw { --c: var(--steel); }
      .g-body { --c: var(--ink); }
      #lines .g-print { stroke: var(--amber); fill: var(--amber); }
      #lines .g-elec { stroke: var(--cyan); fill: var(--cyan); }
      #lines .g-hw { stroke: var(--steel); fill: var(--steel); }
      #lines .g-body { stroke: var(--ink); fill: var(--ink); }
      #lines polyline { fill: none !important; }
      #lines circle { fill-opacity: 0.25 !important; }

      /* ---- callouts ---- */
      .co {
        position: absolute;
        width: 520px;
        height: 96px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .co.left { left: 70px; flex-direction: row-reverse; text-align: right; }
      .co.right { left: 1330px; text-align: left; }
      .co-bar {
        flex: none;
        width: 5px;
        height: 84px;
        background: var(--c);
        border-radius: 3px;
        transform-origin: 50% 50%;
      }
      .co-txt { display: flex; flex-direction: column; gap: 4px; }
      .co-n {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--c);
      }
      .co-t {
        font-family: var(--display);
        font-size: 34px;
        line-height: 1.05;
        letter-spacing: 0.03em;
        color: var(--ink);
      }
      .co-s {
        font-size: 18px;
        line-height: 1.3;
        color: var(--mute);
      }

      /* ---- hero / outro text (left column) ---- */
      .block {
        position: absolute;
        left: 110px;
        top: 0;
        width: 760px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      .tag {
        align-self: flex-start;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: var(--bg);
        background: var(--amber);
        padding: 8px 16px;
        border-radius: 4px;
      }
      .word {
        display: flex;
        font-family: var(--display);
        font-size: 270px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: var(--blue);
      }
      .word .m { display: block; overflow: hidden; padding-bottom: 26px; margin-bottom: -26px; }
      .word .c { display: block; }
      .sub {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--amber);
      }
      .sub2 {
        font-size: 22px;
        line-height: 1.5;
        color: var(--mute);
        max-width: 640px;
      }
      .stats { display: flex; gap: 18px; margin-top: 8px; }
      .stat {
        min-width: 190px;
        padding: 16px 20px 14px;
        border: 2px solid rgba(238, 242, 248, 0.22);
        border-radius: 10px;
        background: rgba(10, 14, 20, 0.6);
      }
      .stat b {
        display: block;
        font-family: var(--display);
        font-weight: 400;
        font-size: 64px;
        line-height: 1;
        color: var(--ink);
      }
      .stat span { display: block; margin-top: 8px; font-size: 16px; letter-spacing: 0.14em; color: var(--mute); }
      .stat.hot b { color: var(--amber); }

      /* ---- persistent HUD ---- */
      #hud-tl {
        position: absolute;
        left: 80px;
        top: 56px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.26em;
        color: var(--mute);
      }
      #hud-tl em { font-style: normal; color: var(--amber); }
      #hud-tr {
        position: absolute;
        right: 80px;
        top: 56px;
        font-size: 18px;
        letter-spacing: 0.2em;
        color: var(--mute);
      }
      #hud-bar {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 44px;
        height: 3px;
        background: rgba(238, 242, 248, 0.12);
        border-radius: 2px;
      }
      #hud-fill {
        width: 100%;
        height: 100%;
        background: var(--amber);
        border-radius: 2px;
        transform-origin: 0 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div id="vwrap">
        <video
          id="render"
          class="clip"
          src="assets/explode.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="21"
          data-track-index="0"
        ></video>
      </div>
      <div id="grid"></div>
      <div id="vignette"></div>

      <div id="ui">
        <svg id="lines" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        <div id="callouts"></div>

        <!-- hero (0-2s) -->
        <div id="hero" class="block" data-layout-allow-overflow="true">
          <div class="tag">hackTurin 2026</div>
          <div class="word" id="hero-word" aria-label="larp."></div>
          <div class="sub">SMART CAMERA</div>
          <div class="sub2">Arduino UNO Q · Media Carrier · IMX219 · Grove LCD 16×2 · LED ring · buzzer</div>
        </div>

        <!-- outro (16.4-21s) -->
        <div id="outro" class="block" data-layout-allow-overflow="true">
          <div class="tag">hackTurin 2026</div>
          <div class="word" id="outro-word" aria-label="larp."></div>
          <div class="stats">
            <div class="stat hot"><b id="n-parts">0</b><span>PRINTED PARTS</span></div>
            <div class="stat"><b id="n-screws">0</b><span>SCREWS</span></div>
            <div class="stat"><b id="n-mods">0</b><span>MODULES</span></div>
          </div>
          <div class="sub2">115 × 115 × 72 mm · open back · screwless lid</div>
        </div>

        <div id="hud-tl">LARP <em>/</em> EXPLODED VIEW</div>
        <div id="hud-tr">OpenSCAD</div>
        <div id="hud-bar"><div id="hud-fill"></div></div>
      </div>
    </div>

    <script>
      /* Pixel anchors of each part in the fully exploded pose (1920x1080 render
         space), measured on the OpenSCAD render (see smart-camera/video). */
      const CO = [
        { id: "uno",     n: "01", g: "elec", side: "right", y: 420, a: [1000, 490], t: "ARDUINO UNO Q",      s: "68.6 × 53.3 mm" },
        { id: "carrier", n: "02", g: "elec", side: "right", y: 540, a: [1000, 600], t: "UNO MEDIA CARRIER",  s: "on 4 pads · CSI0 and CSI1 free" },
        { id: "cam",     n: "03", g: "elec", side: "right", y: 660, a: [1030, 656], t: "CAMERA IMX219 8MP",  s: "4 × M2 · Ø13 mm opening" },
        { id: "lcd",     n: "04", g: "elec", side: "right", y: 800, a: [1065, 840], t: "GROVE LCD 16×2",     s: "bezel window · 4 × M2.5" },
        { id: "ring",    n: "05", g: "elec", side: "left",  y: 680, a: [792, 745],  t: "GROVE RGB LED RING", s: "16 × WS2813 · Ø58 mm · light through slots" },
        { id: "buzzer",  n: "06", g: "elec", side: "left",  y: 860, a: [975, 776],  t: "GROVE PASSIVE BUZZER", s: "20 × 20 × 10 mm · glued below the camera" },
      ];
      const SVGNS = "http://www.w3.org/2000/svg";
      const lines = document.getElementById("lines");
      const host = document.getElementById("callouts");
      CO.forEach((c) => {
        const el = document.createElement("div");
        el.className = "co " + c.side + " g-" + c.g;
        el.id = "co-" + c.id;
        el.style.top = c.y - 48 + "px";
        el.innerHTML =
          '<div class="co-bar"></div><div class="co-txt"><div class="co-n">' + c.n +
          '</div><div class="co-t">' + c.t + '</div><div class="co-s">' + c.s + "</div></div>";
        host.appendChild(el);

        const x0 = c.side === "left" ? 606 : 1314;
        const ex = c.side === "left" ? x0 + 44 : x0 - 44;
        const pl = document.createElementNS(SVGNS, "polyline");
        pl.setAttribute("points", x0 + "," + c.y + " " + ex + "," + c.y + " " + c.a[0] + "," + c.a[1]);
        pl.setAttribute("class", "g-" + c.g);
        pl.setAttribute("pathLength", "1");
        pl.setAttribute("stroke-dasharray", "1");
        pl.setAttribute("stroke-dashoffset", "1");
        pl.id = "ln-" + c.id;
        lines.appendChild(pl);
        const dot = document.createElementNS(SVGNS, "circle");
        dot.setAttribute("cx", c.a[0]);
        dot.setAttribute("cy", c.a[1]);
        dot.setAttribute("r", "8");
        dot.setAttribute("class", "g-" + c.g);
        dot.id = "dt-" + c.id;
        lines.appendChild(dot);
      });

      // kinetic word: one masked span per letter
      function buildWord(id) {
        const w = document.getElementById(id);
        "larp.".split("").forEach((ch) => {
          const m = document.createElement("span");
          m.className = "m";
          const c = document.createElement("span");
          c.className = "c";
          c.textContent = ch;
          m.appendChild(c);
          w.appendChild(m);
        });
      }
      buildWord("hero-word");
      buildWord("outro-word");

      const tl = gsap.timeline({ paused: true });

      /* ---- render framing: sit right of the title, then centre while exploding ---- */
      tl.set("#vwrap", { x: 240, scale: 0.88 }, 0);
      tl.to("#vwrap", { x: 0, scale: 1, duration: 3.4, ease: "power2.inOut" }, 2.0);
      tl.to("#vwrap", { x: 240, scale: 0.88, duration: 3.4, ease: "power2.inOut" }, 12.8);

      /* ---- HUD ---- */
      tl.fromTo("#hud-tl", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo("#hud-tr", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.fromTo("#hud-fill", { scaleX: 0 }, { scaleX: 1, duration: 21, ease: "none" }, 0);

      /* ---- hero: kinetic "larp" ---- */
      tl.fromTo("#hero-word .c", { yPercent: 115 }, { yPercent: 0, duration: 0.8, ease: "power4.out", stagger: 0.09 }, 0.1);
      tl.fromTo("#hero .tag", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#hero .sub", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.55);
      tl.fromTo("#hero .sub2", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.to("#hero", { autoAlpha: 0, x: -90, duration: 0.55, ease: "power2.in" }, 1.85);

      /* ---- callouts: staggered once the pose is static (camera locked 5.4-12.8 s) ---- */
      CO.forEach((c, i) => {
        const t0 = 5.8 + i * 0.3;
        const isLeft = c.side === "left";
        tl.fromTo("#dt-" + c.id, { autoAlpha: 0, scale: 0.2, transformOrigin: "50% 50%" },
          { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t0);
        tl.fromTo("#ln-" + c.id, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, t0);
        tl.fromTo("#co-" + c.id + " .co-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, t0 + 0.25);
        tl.fromTo("#co-" + c.id + " .co-txt", { autoAlpha: 0, x: isLeft ? 30 : -30 },
          { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, t0 + 0.3);
        // leave before the parts start sliding back together
        const t1 = 12.1 + i * 0.04;
        tl.to("#co-" + c.id, { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, t1);
        tl.to("#ln-" + c.id, { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, t1);
        tl.to("#dt-" + c.id, { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, t1);
      });

      /* ---- outro ---- */
      tl.fromTo("#outro", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05 }, 16.35);
      tl.fromTo("#outro .tag", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 16.4);
      tl.fromTo("#outro-word .c", { yPercent: 115 }, { yPercent: 0, duration: 0.8, ease: "power4.out", stagger: 0.09 }, 16.4);
      tl.fromTo("#outro .stat", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.12 }, 16.8);
      const cnt = { parts: 0, screws: 0, mods: 0 };
      const paint = () => {
        document.getElementById("n-parts").textContent = Math.round(cnt.parts);
        document.getElementById("n-screws").textContent = Math.round(cnt.screws);
        document.getElementById("n-mods").textContent = Math.round(cnt.mods);
      };
      tl.fromTo(cnt, { parts: 0, screws: 0, mods: 0 }, { parts: 5, screws: 16, mods: 6, duration: 1.4, ease: "power2.out", onUpdate: paint }, 16.9);
      tl.fromTo("#outro .sub2", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 17.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
